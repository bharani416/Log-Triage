name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run on sample log
        run: ./build/logtriage samples/device.log --top 5
