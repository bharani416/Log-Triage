name: Unpack
on:
  push:
    paths: ['LogTriage-upload.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          unzip -oq LogTriage-upload.zip
          cp -r LogTriage/. .
          rm -rf LogTriage LogTriage-upload.zip
          sed -i '/^\[!\[CI\]/d' README.md
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add LogTriage project"
          git push
